<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About Me 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme" class="btn" title="Ganti tema">🌙</button>
  <div class="float" id="float"></div>

  <main>
    <section class="card hero">
      <div class="avatar" id="avatar" title="Klik aku!">
        <img id="photo" src="foto.jpeg" alt="Fotoku" hidden>
        <span id="emoji">🐰</span>
      </div>
      <h1>Hai, aku yaya! <span class="wave">👋</span></h1>
      <p class="tag">✨ si anak baik✨</p>
      <p>WELCOMEEEeeeeeEEe! 💕</p>
    </section>

    <section class="card player">
      <div class="disc" id="disc">🎵</div>
      <div class="info">
        <h2>🎶 Music</h2>
        <p class="tag" id="songTitle">YOU! - LANY</p>
        <button id="playBtn" class="btn">▶ Putar Lagu</button>
        <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Volume">
      </div>
    </section>

    <section class="card">
      <h2>🎀 Hobi &amp; Kesukaan</h2>
      <p class="tag">Klik tiap bubble ya!</p>
      <div class="chips" id="chips"></div>
    </section>

    <section class="card">
      <h2>📊 Level Kelucuan</h2>
      <div id="bars"></div>
    </section>

    <section class="card">
      <h2>🎲 Fun Fact</h2>
      <div class="fact" id="fact">Klik tombol di bawah! 👇</div>
      <div class="center"><button id="factBtn" class="btn">Kasih tahu dong! 🎁</button></div>
    </section>

    <section class="card">
      <h2>💌 Tinggalkan Pesan</h2>
      <p class="tag">what do u think about me?~</p>
      <input id="name" maxlength="24" placeholder="Namamu 🌷">
      <textarea id="text" maxlength="200" placeholder="Pesanmu di sini... (maks 200 karakter)"></textarea>
      <div class="emojis" id="emojis"></div>
      <button id="send" class="btn">Kirim Pesan 💖</button>
      <p class="status" id="status"></p>
      <div class="notes" id="notes"></div>
    </section>

    <footer>Dibuat dengan 💗 dan banyak glitter</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
